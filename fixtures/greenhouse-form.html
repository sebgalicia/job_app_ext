<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Greenhouse form fixture</title>
<body>
  <form>
    <div class="field">
      <label class="label" for="gh-email">Email</label>
      <input id="gh-email" name="email" type="email">
    </div>
    <div class="field">
      <label class="label">Will you now or in the future require sponsorship?</label>
      <label><input type="radio" name="sponsor" value="yes"> Yes, I will require sponsorship</label>
      <label><input type="radio" name="sponsor" value="no"> I do not need sponsorship</label>
    </div>
  </form>
</body>
</html>
