<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>iCIMS application fixture</title>
<body>
  <main data-qa="icims-application-form">
    <h1>Software Engineer application</h1>
    <form>
      <div class="iCIMS_FieldRow">
        <label class="iCIMS_Label" for="icims-email">Email address</label>
        <input id="icims-email" name="email" type="email" autocomplete="email">
      </div>
      <div class="iCIMS_FieldRow">
        <label class="iCIMS_Label" for="icims-motivation">Why are you interested in this position?</label>
        <textarea id="icims-motivation" name="motivation"></textarea>
      </div>
    </form>
  </main>
</body>
</html>
