<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ashby application fixture</title>
<body>
  <main data-qa="ashby-application-form">
    <h1>Software Engineer application at Example Company</h1>
    <form>
      <div class="ashby-application-form-field">
        <label class="ashby-application-form-field-label" for="ashby-email">Email address</label>
        <input id="ashby-email" name="email" type="email" autocomplete="email">
      </div>
      <div class="ashby-application-form-field">
        <label class="ashby-application-form-field-label" for="ashby-motivation">Why are you interested in this role?</label>
        <textarea id="ashby-motivation" name="motivation"></textarea>
      </div>
    </form>
  </main>
</body>
</html>
