<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Workday application fixture</title>
<body>
  <main data-automation-id="applicationForm">
    <h1>Software Engineer application at Example Company</h1>
    <form>
      <section id="workday-step-one">
      <!-- Production Workday names wrappers formField-<field> and labels without for=. -->
      <div data-automation-id="formField-legalNameSection_firstName">
        <label data-automation-id="formField-label">Given Name(s)</label>
        <input data-automation-id="legalNameSection_firstName" type="text">
      </div>
      <div data-automation-id="formField-legalNameSection_lastName">
        <label data-automation-id="formField-label">Family Name</label>
        <input data-automation-id="legalNameSection_lastName" type="text">
      </div>
      <div data-automation-id="formField">
        <label data-automation-id="formField-label" for="workday-email">Email address</label>
        <input id="workday-email" name="email" type="email" autocomplete="email">
      </div>
      <div data-automation-id="formField">
        <span data-automation-id="formField-label" id="workday-location-label">Preferred work location</span>
        <select id="workday-location" name="location" aria-labelledby="workday-location-label">
          <option value="">Select a location</option>
          <option value="boston">Boston</option>
          <option value="remote">Remote</option>
        </select>
      </div>
      <div data-automation-id="formField">
        <span data-automation-id="formField-label">Preferred schedule</span>
        <!-- Like production Workday: closed until clicked, options rendered in a page-level popup. -->
        <button type="button" aria-haspopup="listbox" aria-label="Preferred schedule" aria-expanded="false" data-options="Hybrid|Remote">Select One</button>
      </div>
      <div data-automation-id="formField-addressSection_countryRegion">
        <span data-automation-id="formField-label">Country</span>
        <button type="button" aria-haspopup="listbox" aria-label="Country" aria-expanded="false" data-options="Canada|United States of America|Mexico">Select One</button>
      </div>
      <fieldset data-automation-id="fieldSet">
        <legend>Are you authorized to work without restriction?</legend>
        <label><input type="radio" name="authorization" value="yes"> Yes</label>
        <label><input type="radio" name="authorization" value="no"> No</label>
      </fieldset>
      <button id="workday-next" type="button">Next step</button>
      </section>
      <section id="workday-step-two" hidden>
        <div data-automation-id="formField">
          <label data-automation-id="formField-label" for="workday-motivation">Why are you interested in this role?</label>
          <textarea id="workday-motivation" name="motivation"></textarea>
        </div>
        <!-- Workday "My Experience": each repeated entry is a labelled group; date boxes are labelled only Month/Year. -->
        <div role="group" aria-labelledby="workday-work-2">
          <h4 id="workday-work-2">Work Experience 2</h4>
          <div data-automation-id="formField-jobTitle"><label data-automation-id="formField-label">Job Title</label><input type="text"></div>
          <div data-automation-id="formField-companyName"><label data-automation-id="formField-label">Company</label><input type="text"></div>
          <div data-automation-id="formField-location"><label data-automation-id="formField-label">Location</label><input type="text"></div>
          <div data-automation-id="formField-startDate">
            <label data-automation-id="formField-label">From</label>
            <div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" placeholder="MM"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
          </div>
          <div data-automation-id="formField-endDate">
            <label data-automation-id="formField-label">To</label>
            <div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" placeholder="MM"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
          </div>
        </div>
        <div role="group" aria-labelledby="workday-edu-1">
          <h4 id="workday-edu-1">Education 1</h4>
          <div data-automation-id="formField-schoolName"><label data-automation-id="formField-label">School or University</label><input type="text"></div>
          <div data-automation-id="formField-fieldOfStudy"><label data-automation-id="formField-label">Field of Study</label><input type="text"></div>
          <div data-automation-id="formField-firstYearAttended">
            <label data-automation-id="formField-label">From</label>
            <div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
          </div>
          <div data-automation-id="formField-lastYearAttended">
            <label data-automation-id="formField-label">To (Actual or Expected)</label>
            <div data-automation-id="dateInputWrapper"><input type="text" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" placeholder="YYYY"></div>
          </div>
        </div>
      </section>
    </form>
  </main>
  <script>
    // Closed-by-default dropdowns: options exist only while open and select on mousedown.
    for (const button of document.querySelectorAll('button[data-options]')) {
      let menu;
      const close = () => {
        menu?.remove();
        menu = undefined;
        button.setAttribute('aria-expanded', 'false');
      };
      button.addEventListener('click', () => {
        if (menu) return close();
        setTimeout(() => {
          menu = document.createElement('ul');
          menu.setAttribute('role', 'listbox');
          for (const text of button.dataset.options.split('|')) {
            const item = document.createElement('li');
            item.setAttribute('role', 'option');
            item.textContent = text;
            item.addEventListener('mousedown', (event) => {
              event.preventDefault();
              button.textContent = text;
              close();
            });
            menu.append(item);
          }
          document.body.append(menu);
          button.setAttribute('aria-expanded', 'true');
        }, 150);
      });
      button.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
    }
    document.querySelector('#workday-next').addEventListener('click', () => {
      document.querySelector('#workday-step-one').hidden = true;
      document.querySelector('#workday-step-two').hidden = false;
      document.querySelector('#workday-motivation').focus();
    });
  </script>
</body>
</html>
