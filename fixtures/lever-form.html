<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lever application fixture</title>
<body>
  <main data-qa="lever-application-form">
    <h1>Software Engineer application at Example Company</h1>
    <form>
      <div class="application-question">
        <label class="application-label" for="lever-email">Email address</label>
        <input id="lever-email" name="email" type="email" autocomplete="email">
      </div>
      <div class="application-question">
        <span class="application-label">Why are you interested in this role?</span>
        <textarea name="motivation" aria-label="Response"></textarea>
      </div>
    </form>
  </main>
</body>
</html>
