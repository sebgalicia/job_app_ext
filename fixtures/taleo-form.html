<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Taleo application fixture</title>
<body>
  <main data-qa="taleo-application-form">
    <h1>Software Engineer application</h1>
    <form>
      <div class="formField">
        <label class="formLabel" for="taleo-email">Email address</label>
        <input id="taleo-email" name="email" type="email" autocomplete="email">
      </div>
      <div class="formField">
        <label class="formLabel" for="taleo-motivation">Why are you interested in this position?</label>
        <textarea id="taleo-motivation" name="motivation"></textarea>
      </div>
    </form>
  </main>
</body>
</html>
