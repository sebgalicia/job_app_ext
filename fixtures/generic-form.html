<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Generic form fixture</title>
<body>
  <form>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" placeholder="name@example.com">
    <fieldset>
      <legend>Are you authorized to work without restriction?</legend>
      <label><input type="radio" name="authorization" value="yes"> Yes</label>
      <label><input type="radio" name="authorization" value="no"> No</label>
    </fieldset>
    <label for="country">Preferred work location</label>
    <select id="country" name="country"><option value="">Choose a location</option><option>Boston</option></select>
  </form>
</body>
</html>
