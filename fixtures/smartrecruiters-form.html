<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SmartRecruiters application fixture</title>
<body>
  <main data-qa="smartrecruiters-application-form">
    <h1>Software Engineer application</h1>
    <form>
      <div class="application-form-field">
        <label for="smart-email">Email address</label>
        <input id="smart-email" name="email" type="email" autocomplete="email">
      </div>
      <div class="application-form-field">
        <label for="smart-motivation">Why are you interested in this position?</label>
        <textarea id="smart-motivation" name="motivation"></textarea>
      </div>
    </form>
  </main>
</body>
</html>
