<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Autofill</title>
    <link rel="stylesheet" href="base.css">
  </head>
  <body>
    <main>
      <h1>Job Autofill</h1>
      <p id="site-name">Current site</p>
      <label class="switch-row" for="site-enabled">
        <input id="site-enabled" type="checkbox">
        <span>Enable previews on this site</span>
      </label>
      <section aria-labelledby="context-heading">
        <h2 id="context-heading">Application details</h2>
        <label for="company">Company</label>
        <input id="company" type="text" autocomplete="organization">
        <label for="role">Role</label>
        <input id="role" type="text">
        <label class="switch-row" for="track-application">
          <input id="track-application" type="checkbox">
          <span>Add this application to my job tracker</span>
        </label>
        <button id="save-context" type="button">Save details</button>
      </section>
      <section aria-labelledby="tracker-heading">
        <h2 id="tracker-heading">Tracked applications</h2>
        <ul id="tracked-applications"></ul>
      </section>
      <p id="match-count" aria-live="polite">Matched fields on this page: 0</p>
      <button id="enable-current-page" type="button" hidden>Enable on this page</button>
      <p id="popup-status" role="status" aria-live="polite"></p>
      <a href="settings.html" target="_blank">Open settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
